services:
  front:
    build:
      context: .
      target: front-dev
    ports:
      - "10000:10000"
    volumes:
      - ./Front:/app/Front
      - go_mod_cache_front:/root/go/pkg/mod
    environment:
      - BACK_URL=${BACK_URL}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - back
    restart: unless-stopped

  back:
    build:
      context: .
      target: back-dev
    ports:
      - "10001:10001"
    volumes:
      - ./Back:/app/Back
      - go_mod_cache_back:/root/go/pkg/mod
      - ./database:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DB_PATH=${DB_PATH}
      - APP_USUARIO=${APP_USUARIO}
      - APP_PASSWORD=${APP_PASSWORD}
      - VLOGS_URL=${VLOGS_URL}
    depends_on:
      - victorialogs
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.23.2-victorialogs
    ports:
      - "9428:9428"
    volumes:
      - vlogs_data:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=7d
    restart: unless-stopped

volumes:
  go_mod_cache_front:
  go_mod_cache_back:
  vlogs_data:
