{{define "tarjeta"}}

<!-- ---- Componente tarjeta: muestra el estado y datos de un contenedor Docker ---- -->
<div class="tarjeta">

    <!-- ---- Cabecera: indicador de estado, nombre y badge ---- -->
    <div class="tarjeta-cabecera">
        <span class="tarjeta-indicador {{if eq .Estado "running"}}tarjeta-indicador--activo{{else}}tarjeta-indicador--inactivo{{end}}"></span><!-- ← verde si running, rojo si no -->
        <span class="tarjeta-nombre">{{.Nombre}}</span>
        <span class="tarjeta-estado {{if eq .Estado "running"}}tarjeta-estado--activo{{else}}tarjeta-estado--inactivo{{end}}">
            {{if eq .Estado "running"}}Activo{{else}}Detenido{{end}}
        </span>
    </div>
    <!-- ---- Fin Cabecera ---- -->

    <!-- ---- Cuerpo: imagen e ID del contenedor ---- -->
    <div class="tarjeta-cuerpo">
        <div class="tarjeta-fila">
            <span class="tarjeta-label">Imagen</span>
            <span class="tarjeta-valor">{{.Imagen}}</span>
        </div>
        <div class="tarjeta-fila">
            <span class="tarjeta-label">ID</span>
            <span class="tarjeta-valor tarjeta-id">{{.ID}}</span>
        </div>
    </div>
    <!-- ---- Fin Cuerpo ---- -->

    <!-- ---- Acciones: botón dinámico según estado + acceso a logs ---- -->
    <div class="tarjeta-acciones">
        {{if eq .Estado "running"}}
        <button class="tarjeta-boton tarjeta-boton--detener"
            data-id="{{.ID}}"
            data-nombre="{{.Nombre}}"
            data-accion="detener"
            onclick="accionContenedor(this)">Detener</button>
        {{else}}
        <button class="tarjeta-boton tarjeta-boton--iniciar"
            data-id="{{.ID}}"
            data-nombre="{{.Nombre}}"
            data-accion="iniciar"
            onclick="accionContenedor(this)">Iniciar</button>
        {{end}}
        <button class="tarjeta-boton tarjeta-boton--logs">Logs</button>
    </div>
    <!-- ---- Fin Acciones ---- -->

</div>
<!-- ---- Fin Componente tarjeta ---- -->

{{end}}
