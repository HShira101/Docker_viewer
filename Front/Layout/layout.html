<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Viewer</title>
    <link rel="stylesheet" href="/public/css/layout.css">
    {{if .CSS}}<link rel="stylesheet" href="/public/css/{{.CSS}}">{{end}}
</head>
<body class="app-pagina">

    <!-- Barra lateral izquierda -->
    <aside class="sidebar">

        <div class="sidebar-cabecera">
            <svg class="sidebar-icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
            </svg>
            <div>
                <div class="sidebar-titulo">Docker Viewer</div>
                <div class="sidebar-usuario">{{.NombreUsuario}}</div>
            </div>
        </div>

        <div class="sidebar-recursos">
            <div class="recurso-titulo">Consumo</div>
            <div class="recurso-fila">
                <span class="recurso-label">CPU</span>
                <span class="recurso-valor" id="stat-cpu">--%</span>
            </div>
            <div class="recurso-fila">
                <span class="recurso-label">RAM</span>
                <span class="recurso-valor" id="stat-ram">-- / -- GB</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/" class="nav-enlace{{if eq .PaginaActual "inicio"}} activo{{end}}">
                <svg class="nav-icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 2a1 1 0 00-.707.293l-7 7a1 1 0 001.414 1.414L4 11.414V17a1 1 0 001 1h4a1 1 0 001-1v-5.586l2.293 2.293a1 1 0 001.414-1.414l-7-7A1 1 0 0010 2z"/>
                </svg>
                Inicio
            <a href="/contenedores" class="nav-enlace{{if eq .PaginaActual "contenedores"}} activo{{end}}">
                <svg class="nav-icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                Contenedores
            </a>
            <a href="/logs" class="nav-enlace{{if eq .PaginaActual "logs"}} activo{{end}}">
                <svg class="nav-icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
                </svg>
                Logs
            </a>
        </nav>

    </aside>
    <!-- Fin Barra lateral izquierda -->

    <!-- Área principal -->
    <div class="app-principal">

        <header class="topbar">
            <h1 class="topbar-titulo">Monitor Docker</h1>
            <form action="/logout" method="POST">
                <button type="submit" class="boton-salir">Cerrar sesión</button>
            </form>
        </header>

        <main class="contenido-principal">
            {{block "content" .}}{{end}}
        </main>

    </div>
    <!-- Fin Área principal -->

    <script src="/public/js/app.js"></script>
</body>
</html>
