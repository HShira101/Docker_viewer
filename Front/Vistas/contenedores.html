{{define "content"}}

<!-- ---- Barra superior: título, timer de última actualización, barra de estado al ejecutar acción y botón actualizar ---- -->
<div class="contenedores-barra">
    <div>
        <h2 class="vista-titulo">Contenedores</h2>
        <span class="ultima-actualizacion">Última actualización: <span id="timer">ahora</span></span><!-- ← contador JS -->
    </div>
    <div class="contenedores-estado" id="estado-barra">
        <span id="estado-mensaje"></span>
    </div>
    <button class="boton-actualizar" id="btn-actualizar" onclick="actualizar()">Actualizar</button>
</div>
<!-- ---- Fin Barra superior ---- -->

<!-- ---- Grupos de contenedores ---- -->
<div class="contenedores-grupos" id="contenedores-grupos">
    {{range .Grupos}}
        {{template "grupo" .}}
    {{else}}
        <p class="vista-subtitulo">No se pudo conectar con el backend o no hay contenedores.</p>
    {{end}}
</div>
<!-- ---- Fin Grupos de contenedores ---- -->

<script>
    // ---- Timer: muestra cuánto tiempo lleva la página sin refrescar datos ----
    let seg = 0;
    const timerEl = document.getElementById('timer');

    setInterval(() => {
        seg++;
        if (seg < 60) {
            timerEl.textContent = 'hace ' + seg + 's';
        } else {
            const m = Math.floor(seg / 60), s = seg % 60;
            timerEl.textContent = 'hace ' + m + 'm ' + s + 's';
        }
    }, 1000);

    // ---- Muestra la barra de estado con un mensaje y estilo según el tipo ----
    function mostrarEstado(mensaje, tipo) {
        const barra  = document.getElementById('estado-barra');
        const textoEl = document.getElementById('estado-mensaje');
        textoEl.textContent = mensaje;
        barra.className = 'contenedores-estado contenedores-estado--' + tipo;
    }

    // ---- Genera links de puertos clicables usando el host actual del browser ----
    function renderPuertos(puertos) {
        if (!puertos || !puertos.length) return '';
        const links = puertos
            .map(p => `<a class="tarjeta-puerto" href="http://${window.location.hostname}:${p.PublicPort}" target="_blank" rel="noopener">:${p.PublicPort}</a>`)
            .join('');
        return `<div class="tarjeta-fila">
            <span class="tarjeta-label">Puertos</span>
            <span class="tarjeta-puertos">${links}</span>
        </div>`;
    }

    // ---- Fija el href correcto en los puertos del render inicial del servidor ----
    function initPuertos() {
        document.querySelectorAll('a.tarjeta-puerto').forEach(a => {
            a.href = `http://${window.location.hostname}:${a.dataset.puerto}`;
        });
    }

    // ---- Construye el HTML de una tarjeta a partir de los datos JSON del contenedor ----
    function renderTarjeta(c) {
        const activo = c.estado === 'running';
        const botonAccion = activo
            ? `<button class="tarjeta-boton tarjeta-boton--detener" data-id="${c.id}" data-nombre="${c.nombre}" data-accion="detener" onclick="accionContenedor(this)">Detener</button>`
            : `<button class="tarjeta-boton tarjeta-boton--iniciar" data-id="${c.id}" data-nombre="${c.nombre}" data-accion="iniciar" onclick="accionContenedor(this)">Iniciar</button>`;
        return `
            <div class="tarjeta">
                <div class="tarjeta-cabecera">
                    <span class="tarjeta-indicador ${activo ? 'tarjeta-indicador--activo' : 'tarjeta-indicador--inactivo'}"></span>
                    <span class="tarjeta-nombre">${c.nombre}</span>
                    <span class="tarjeta-estado ${activo ? 'tarjeta-estado--activo' : 'tarjeta-estado--inactivo'}">
                        ${activo ? 'Activo' : 'Detenido'}
                    </span>
                </div>
                <div class="tarjeta-cuerpo">
                    <div class="tarjeta-fila">
                        <span class="tarjeta-label">Imagen</span>
                        <span class="tarjeta-valor">${c.imagen}</span>
                    </div>
                    ${renderPuertos(c.puertos)}
                </div>
                <div class="tarjeta-acciones">
                    ${botonAccion}
                    <button class="tarjeta-boton tarjeta-boton--logs">Logs</button>
                </div>
            </div>`;
    }

    // ---- Agrupa la lista plana de contenedores por compose_project ----
    function agrupar(lista) {
        const mapa = new Map();
        for (const c of lista) {
            const key = c.compose_project || '';
            if (!mapa.has(key)) mapa.set(key, []);
            mapa.get(key).push(c);
        }
        // proyectos nombrados primero, "sin proyecto" (key vacía) al final
        return [...mapa.entries()].sort((a, b) => {
            if (!a[0]) return 1;
            if (!b[0]) return -1;
            return a[0].localeCompare(b[0]);
        });
    }

    // ---- Construye el HTML de un grupo con su cabecera y sus tarjetas ----
    function renderGrupo(nombre, contenedores) {
        const label = nombre || 'Sin proyecto';
        return `
            <div class="grupo">
                <div class="grupo-cabecera">
                    <span class="grupo-nombre">${label}</span>
                    <span class="grupo-contador">${contenedores.length}</span>
                </div>
                <div class="grupo-grid">
                    ${contenedores.map(renderTarjeta).join('')}
                </div>
            </div>`;
    }

    // ---- Pide datos frescos al backend, agrupa y actualiza la vista sin recargar ----
    async function actualizar() {
        const btn = document.getElementById('btn-actualizar');
        btn.disabled = true;
        btn.textContent = 'Actualizando...';

        try {
            const resp   = await fetch('/api/contenedores');
            const lista  = await resp.json();
            const wrapper = document.getElementById('contenedores-grupos');

            wrapper.innerHTML = lista.length
                ? agrupar(lista).map(([nombre, contenedores]) => renderGrupo(nombre, contenedores)).join('')
                : '<p class="vista-subtitulo">No hay contenedores.</p>';

            seg = 0;
            timerEl.textContent = 'ahora';
        } catch (e) {
            console.error('Error al actualizar:', e);
        }

        btn.disabled = false;
        btn.textContent = 'Actualizar';
    }

    initPuertos(); // ← fija hrefs en el render inicial del servidor

    // ---- Envía acción iniciar/detener al backend y muestra el resultado en la barra ----
    async function accionContenedor(btn) {
        // --- Recibe btn como el elemento button que disparó el evento ---
        const id     = btn.dataset.id;
        const nombre = btn.dataset.nombre;
        const accion = btn.dataset.accion;
        const texto  = accion === 'iniciar' ? 'Iniciando' : 'Deteniendo';

        mostrarEstado(texto + ' contenedor ' + nombre + '...', 'progreso');
        btn.disabled = true;

        try {
            const resp = await fetch('/api/contenedores/' + id + '/' + accion, { method: 'POST' });
            const data = await resp.json();

            mostrarEstado(data.mensaje, data.ok ? 'ok' : 'error');

            if (data.ok) {
                await actualizar(); // ← refresca el grid con los estados actualizados
                setTimeout(() => {
                    document.getElementById('estado-barra').className = 'contenedores-estado';
                }, 3000); // ← oculta la barra de éxito a los 3 segundos
            }
        } catch (e) {
            mostrarEstado('Error de conexión con el servidor', 'error');
        }

        btn.disabled = false;
    }
</script>

{{end}}
